<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon panier | Maison Rouge</title><link rel="stylesheet" href="style.css"></head><body><main class="checkout-wrap"><div class="checkout-title"><p class="eyebrow">FINALISER MA COMMANDE</p><h1>Mon <em>panier.</em></h1><p>Vérifiez vos produits et renseignez vos coordonnées de livraison.</p></div><div class="checkout-layout"><section class="checkout-panel"><h2>Votre sélection</h2><div id="checkoutItems"></div><div class="checkout-total"><span>Total produits</span><b id="checkoutTotal">0 DH</b></div></section><section class="checkout-panel"><h2>Vos informations</h2><form id="orderForm"><div class="form-grid"><label>Nom complet *<input name="name" required placeholder="Votre nom"></label><label>Téléphone *<input name="phone" required type="tel" placeholder="06 00 00 00 00"></label><label class="wide">Adresse complète *<input name="address" required placeholder="Rue, numéro, immeuble, appartement"></label><label>Ville / quartier *<input name="city" required placeholder="Votre ville et quartier"></label><label>Mode de réception<select name="delivery"><option>Livraison à domicile</option><option>À emporter</option></select></label><label class="wide">Mode de paiement<select name="payment"><option>Espèces à la livraison</option><option>Espèces au retrait</option></select></label><label class="wide">Instructions / note<textarea name="note" placeholder="Repère, étage, sans oignons... (facultatif)"></textarea></label></div><button class="submit-order" type="submit">Confirmer sur WhatsApp ↗</button><p class="small-note">Vos coordonnées et votre commande seront envoyées au restaurant sur WhatsApp pour confirmation.</p></form></section></div></main><script src="app.js"></script><script>shell();renderCheckout();</script></body></html>
